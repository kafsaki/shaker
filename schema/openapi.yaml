info:
  title: shaker
  version: 0.1.0
openapi: 3.1.0
paths:
  /api/v1/auth/login:
    post:
      description: identifier 接受 handle 或 email。
      operationId: auth-login
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenPairBody"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Error
      summary: 登录
  /api/v1/auth/logout:
    post:
      description: 撤销当前会话链（含其刷新令牌）。
      operationId: auth-logout
      responses:
        "204":
          description: No Content
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Error
      security:
        - bearerAuth: []
      summary: 登出
  /api/v1/auth/logout-all:
    post:
      operationId: auth-logout-all
      responses:
        "204":
          description: No Content
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Error
      security:
        - bearerAuth: []
      summary: 登出全部设备
  /api/v1/auth/refresh:
    post:
      description: 旧刷新令牌立即失效。检测到旧令牌重放会撤销该账号全部会话。
      operationId: auth-refresh
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenPairBody"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Error
      summary: 刷新令牌
  /api/v1/auth/register:
    post:
      description: 创建账号并返回令牌对。刷新令牌仅此一次返回，客户端须妥善保存。
      operationId: auth-register
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenPairBody"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Error
      summary: 注册账号
  /api/v1/classics:
    get:
      description: 全部权威条目（is_canonical），按发布时间倒序。
      operationId: classics-list
      parameters:
        - explode: false
          in: query
          name: ibaCategory
          schema:
            enum:
              - unforgettable
              - contemporary
              - new_era
            type: string
        - explode: false
          in: query
          name: family
          schema:
            maxLength: 64
            type: string
        - explode: false
          in: query
          name: cursor
          schema:
            type: string
        - explode: false
          in: query
          name: limit
          schema:
            format: int64
            maximum: 50
            minimum: 1
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecipeListOutputBody"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Error
      summary: 经典列表
  /api/v1/classics/{classicKey}:
    get:
      description: 等价于该 classic_key 下 is_canonical 的配方。
      operationId: classics-get
      parameters:
        - in: path
          name: classicKey
          required: true
          schema:
            maxLength: 64
            minLength: 1
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecipeBody"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Error
      summary: 权威条目
  /api/v1/classics/{classicKey}/distribution:
    get:
      description: 变体的原料用量与 ABV 分位统计（p10/p25/median/p75/p90），数据来自 recipe_ingredients 投影的聚合（ADR-013）。
      operationId: classics-distribution
      parameters:
        - in: path
          name: classicKey
          required: true
          schema:
            maxLength: 64
            minLength: 1
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DistributionOutputBody"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Error
      summary: 规格分布
  /api/v1/classics/{classicKey}/variants:
    get:
      description: 该经典的社区配方（不含权威条目），sort=hot|new。
      operationId: classics-variants
      parameters:
        - in: path
          name: classicKey
          required: true
          schema:
            maxLength: 64
            minLength: 1
            type: string
        - explode: false
          in: query
          name: sort
          schema:
            default: hot
            enum:
              - hot
              - new
            type: string
        - explode: false
          in: query
          name: cursor
          schema:
            type: string
        - explode: false
          in: query
          name: limit
          schema:
            format: int64
            maximum: 50
            minimum: 1
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecipeListOutputBody"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Error
      summary: 社区变体
  /api/v1/comments/{id}:
    delete:
      description: 顶层评论连回复一起软删，计数同步回退。
      operationId: comments-delete
      parameters:
        - in: path
          name: id
          required: true
          schema:
            format: uuid
            type: string
      responses:
        "204":
          description: No Content
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Error
      security:
        - bearerAuth: []
      summary: 软删自己的评论
    patch:
      operationId: comments-update
      parameters:
        - in: path
          name: id
          required: true
          schema:
            format: uuid
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCommentInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommentBody"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Error
      security:
        - bearerAuth: []
      summary: 编辑自己的评论
  /api/v1/comments/{id}/like:
    delete:
      operationId: comments-unlike
      parameters:
        - in: path
          name: id
          required: true
          schema:
            format: uuid
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CountOutputBody"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Error
      security:
        - bearerAuth: []
      summary: 取消评论点赞（幂等）
    put:
      operationId: comments-like
      parameters:
        - in: path
          name: id
          required: true
          schema:
            format: uuid
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CountOutputBody"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Error
      security:
        - bearerAuth: []
      summary: 评论点赞（幂等）
  /api/v1/comments/{id}/replies:
    get:
      operationId: comments-replies
      parameters:
        - in: path
