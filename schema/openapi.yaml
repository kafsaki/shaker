  /api/v1/search:
    get:
      description: type=all 返回分组（每组前 5 条 + total + 查看全部链接）；专用类型（recipe/user/ingredient）返回对应分组并带 nextCursor 翻页。配方搜索支持多维筛选：ingredient 可重复传（AND 语义），ingredientRole 限定角色，relevance 排序把权威条目置顶后按 trgm 相似度（ADR-012）。menu 分组随酒单功能填充。
      operationId: search
      parameters:
        - explode: false
          in: query
          name: q
          schema:
            maxLength: 100
            type: string
        - explode: false
          in: query
          name: type
          schema:
            default: all
            enum:
              - recipe
              - user
              - ingredient
              - menu
              - all
            type: string
        - explode: true
          in: query
          name: ingredient
          schema:
            items:
              type: string
            maxItems: 10
            type:
              - array
              - "null"
        - explode: false
          in: query
          name: ingredientRole
          schema:
            enum:
              - base
              - modifier
              - sweetener
              - souring
              - bittering
              - lengthener
              - texture
              - rinse
            type: string
        - explode: false
          in: query
          name: family
          schema:
            maxLength: 64
            type: string
        - explode: false
          in: query
          name: method
          schema:
            maxLength: 32
            type: string
        - explode: false
          in: query
          name: glass
          schema:
            maxLength: 64
            type: string
        - explode: false
          in: query
          name: tag
          schema:
            maxLength: 64
            type: string
        - explode: false
          in: query
          name: abvMin
          schema:
            format: double
            maximum: 100
            minimum: 0
            type: number
        - explode: false
          in: query
          name: abvMax
          schema:
            format: double
            maximum: 100
            minimum: 0
            type: number
        - explode: false
          in: query
          name: difficultyMax
          schema:
            format: int64
            maximum: 5
            minimum: 1
            type: integer
        - explode: false
          in: query
          name: sort
          schema:
            default: relevance
            enum:
              - relevance
              - hot
              - new
            type: string
        - explode: false
          in: query
          name: cursor
          schema:
            type: string
        - explode: false
          in: query
          name: limit
          schema:
            format: int64
            maximum: 50
            minimum: 1
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchOutputBody"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Error
      summary: 全站搜索
